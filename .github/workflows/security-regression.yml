name: Security regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: bash -n install.sh uninstall.sh lib/dotfiles.sh tests/install.sh
      - name: Test installation and rollback
        run: bash tests/install.sh
      - name: Test Vim filename escaping
        run: python3 tests/vim-save.py
